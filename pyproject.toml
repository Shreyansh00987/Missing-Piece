[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "missing-piece"
version = "1.0.0"
description = "A benchmark evaluating whether AI models recognize unanswerable word problems and abstain, or hallucinate confident answers."
readme = "README.md"
authors = [
    { name = "Missing Piece Research Team", email = "research@missingpiece.ai" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "tabulate>=0.9.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
local-models = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
